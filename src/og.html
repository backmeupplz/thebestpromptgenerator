<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0d0f12;color:#f2f0ea;font-family:-apple-system,system-ui,sans-serif;position:relative}
.g{position:absolute;inset:0;background-image:linear-gradient(rgba(79,163,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(79,163,255,.12) 1px,transparent 1px);background-size:48px 48px}
.glow{position:absolute;inset:0;background:radial-gradient(520px 340px at 930px 455px,rgba(255,170,0,.30),transparent 70%),radial-gradient(700px 400px at 90% 0%,rgba(255,196,0,.14),transparent 70%)}
.tape{position:absolute;left:0;right:0;height:30px;background:repeating-linear-gradient(-45deg,#ffc400 0 22px,#111 22px 44px)}
.t{top:0}.b{bottom:0}
.c{position:absolute;left:80px;top:84px;right:80px}
h1{font-size:104px;line-height:.95;margin:0 0 26px;font-weight:900;text-transform:uppercase;letter-spacing:-.02em}
h1 span{color:#ffc400;text-shadow:0 0 40px rgba(255,196,0,.35)}
p{margin:0 0 34px;font-size:30px;line-height:1.3;color:#cfcabd;max-width:1040px}
p b{color:#fff}
.ui{display:flex;gap:22px;align-items:stretch;width:1040px}
.box{flex:1;background:#0b0c0f;border:3px dashed #4b525c;border-radius:8px;padding:0 24px;font:500 27px/1 Menlo,monospace;color:#8d8a82;display:flex;align-items:center;height:92px}
.btn{position:relative;background:#ffc400;color:#000;font:900 30px/1 -apple-system,system-ui,sans-serif;letter-spacing:.05em;text-transform:uppercase;padding:0 36px;border-radius:8px;display:flex;align-items:center;height:92px;box-shadow:0 8px 0 #b38900,0 0 60px rgba(255,196,0,.45);overflow:hidden}
.btn i{position:absolute;left:0;right:0;bottom:0;height:9px;background:repeating-linear-gradient(-45deg,#000 0 10px,transparent 10px 20px);opacity:.55}
svg{position:absolute;left:0;top:0}
</style></head><body><div class="g"></div><div class="glow"></div>
<svg width="1200" height="630" viewBox="0 0 1200 630" id="sp"></svg>
<div class="tape t"></div><div class="tape b"></div>
<div class="c">
<h1>The best <span>prompt</span><br>generator</h1>
<p>Describe what you want in <b>plain English</b> and get the perfect prompt for AI.</p>
<div class="ui"><div class="box">What do you want to build?</div><div class="btn">Generate prompt<i></i></div></div>
</div>
<script>
// welding spray off the button's top-right corner: ballistic streaks, deterministic
let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;
const sv=document.getElementById('sp'),ox=1104,oy=424,g=1400;let h='<defs><radialGradient id="f"><stop offset="0" stop-color="#fff"/><stop offset=".2" stop-color="#fff4c0" stop-opacity=".95"/><stop offset=".55" stop-color="#ffb000" stop-opacity=".35"/><stop offset="1" stop-color="#ff7a00" stop-opacity="0"/></radialGradient></defs>';
for(let i=0;i<150;i++){const a=r()<.15?Math.PI*(0.02+r()*0.12):-Math.PI*(0.02+Math.pow(r(),1.2)*0.4),v=180+r()*620,t0=0.02+r()*0.38,dt=0.03+r()*0.07;
let d='';for(let k=0;k<=6;k++){const t=t0+dt*k/6,x=ox+Math.cos(a)*v*t,y=oy+Math.sin(a)*v*t+0.5*g*t*t;d+=(k?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}
const heat=1-t0/0.4,c=heat>.6?'#fff7dc':heat>.3?'#ffd23f':'#ff8c1a';
h+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="${(1+heat*2.2).toFixed(1)}" stroke-linecap="round" opacity="${(.45+heat*.55).toFixed(2)}"/>`}
h+=`<circle cx="${ox}" cy="${oy}" r="70" fill="url(#f)"/>`;sv.innerHTML=h;
</script>
</body></html>
